# AI Personal Finance Advisor Configuration

project:
  name: "AI Personal Finance Advisor"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data: "data/raw/0000.parquet"
  processed_data_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  final_model_path: "models/final_model.joblib"
  split_metadata_path: "reports/split_metadata.json"

data_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  sample_size_for_training: 200000  # High performance training subset for responsive iteration

tfidf:
  ngram_range: [1, 2]
  max_features: 25000
  sublinear_tf: true
  min_df: 2

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
  linear_svm:
    C: 1.0
    max_iter: 1000
  naive_bayes:
    alpha: 0.1

analytics:
  anomaly_contamination: 0.05
  recurring_transaction_min_count: 3

app:
  title: "AI Personal Finance Advisor"
  page_icon: "💰"
  layout: "wide"
